[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongodb", "mongoose"]
  included_files = ["**"]

[build.environment]
  NODE_VERSION = "22"

[[scheduled-functions]]
  name = "generate-briefing"
  schedule = "0 5 * * *"

[functions."api-briefing-generate"]
  timeout = 60